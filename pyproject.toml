[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-system-backend"
version = "0.1.0"
description = "Layered memory system backend (AG-00/AG-01)"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "packaging>=24,<26",
  "pgvector>=0.3.6,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "SQLAlchemy>=2.0.36,<3",
  "structlog>=24.1,<26",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]
integration = [
  "testcontainers[postgres]>=4.9,<5",
]
ml = [
  "torch>=2.4",
  "safetensors>=0.4",
  "transformers>=4.44",
]

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = [
  "integration: requires Docker and explicitly enabled external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
